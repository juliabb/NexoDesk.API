services:
  postgres:
    image: postgres:18-alpine
    container_name: nexodesk-postgres-dev
    environment:
      POSTGRES_DB: nexodesk_dev
      POSTGRES_USER: nexodesk_dev
      POSTGRES_PASSWORD: nexodesk_dev_local
    ports:
      - "5433:5432"
    volumes:
      - nexodesk_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexodesk_dev -d nexodesk_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexodesk_postgres_data:
